# Render Blueprint — three micro-frontends and their three .NET backends.
#
# Each app is a self-contained unit: `<app>/fe` (Vite static site) and
# `<app>/be` (ASP.NET Core web service), deployed as two Render services.
#
#   apps/host    shell  — owns the user, permissions, and the nav the shell renders
#   remotes/em   Employee Management — the worker roster
#   remotes/dtd  Digital Training Delivery — the course catalog
#
# Two things the browser does cross-origin, both of which need explicit config:
#   1. The host loads each remote's federated chunks from the remote's OWN origin,
#      so remotes must send Access-Control-Allow-Origin (the `headers` blocks).
#   2. The frontends call the APIs directly at their own onrender.com origins, so
#      each backend must allow the calling origins (CORS_ALLOWED_ORIGINS).
#
# NOTE: header and routing rules for a static site must be declared here (or in
# the dashboard). Render does not read a `_headers` file from the build output.
#
# The DATABASE ("mf-itm") lives on NEON, not Render, so it is not declared in this
# file. Each backend reads DATABASE_URL — set it per service in the dashboard (or
# in an env group) to the Neon connection string. See README "Database (Neon)".
#
# Deploy order does not matter for the remotes, but the host's FE build needs the
# remote URLs to already be known.

services:
  # =========================================================== backends ===
  # .NET services. `rootDir` is the REPO ROOT, not the `be/` folder: the build
  # links shared source from packages/service-defaults and reads the root
  # Directory.Build.props, both of which sit outside the project directory.

  - type: web
    runtime: docker
    name: mf-itm-host-api
    dockerfilePath: ./apps/host/be/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Neon connection string. Marked sync:false so it is NOT stored in this
      # file — set the value in the Render dashboard. Accepts either Neon's
      # postgresql:// URI or Npgsql key/value form.
      - key: DATABASE_URL
        sync: false
      # The FE origins allowed to call this API. The host FE calls it directly
      # from the browser, so its origin must be listed here or every request is
      # blocked by CORS. Update if you attach custom domains.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mf-itm-host.onrender.com,https://em-tv4i.onrender.com,https://mf-itm-m5xr.onrender.com

  - type: web
    runtime: docker
    name: mf-itm-em-api
    dockerfilePath: ./remotes/em/be/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # The EM remote's widget runs INSIDE the host page, so the browser's origin
      # is the HOST's — that origin, not the remote's, is what CORS checks.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mf-itm-host.onrender.com,https://em-tv4i.onrender.com

  - type: web
    runtime: docker
    name: mf-itm-dtd-api
    dockerfilePath: ./remotes/dtd/be/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://mf-itm-host.onrender.com,https://mf-itm-m5xr.onrender.com

  # ========================================================== frontends ===
  # ------------------------------------------------------------ remotes ---
  - type: web
    runtime: static
    name: mf-itm-em
    # No `rootDir`: the build runs from the REPO ROOT so pnpm can see
    # pnpm-workspace.yaml and the lockfile, then `--filter` narrows the build to
    # this one workspace. Installing from inside remotes/em/fe would not resolve
    # the workspace root, so `workspace:*` deps (@mf-itm/ui) would not link.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mf-itm/em build
    # Relative to the repo root, since there is no rootDir to resolve against.
    staticPublishPath: remotes/em/fe/dist
    envVars:
      # Vite inlines VITE_* at BUILD time, so the API origin must be present when
      # `vite build` runs — setting it at runtime has no effect on a built bundle.
      - key: VITE_EM_API_URL
        value: https://mf-itm-em-api.onrender.com
    # Remote MFEs are an ASSET ORIGIN, not an app: a request for a missing chunk
    # must 404 so Module Federation reports it, instead of silently receiving
    # index.html and failing later with a JS parse error. Declaring no catch-all
    # rewrite keeps Render's default 404 behaviour.
    headers:
      # remoteEntry.js + every federated chunk is fetched by the host's origin.
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Stable filename whose contents change each deploy — must revalidate,
      # otherwise browsers pin an old container that points at dead chunks.
      - path: /remoteEntry.js
        name: Cache-Control
        value: no-cache

  - type: web
    runtime: static
    name: mf-itm-dtd
    # Built from the repo root and filtered — see the em remote above.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mf-itm/dtd build
    staticPublishPath: remotes/dtd/fe/dist
    envVars:
      - key: VITE_DTD_API_URL
        value: https://mf-itm-dtd-api.onrender.com
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /remoteEntry.js
        name: Cache-Control
        value: no-cache

  # --------------------------------------------------------------- host ---
  - type: web
    runtime: static
    name: mf-itm-host
    # Built from the repo root and filtered — see the em remote above.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mf-itm/host build
    staticPublishPath: apps/host/fe/dist
    envVars:
      # Build-time only, and must be the remotes' PUBLIC origins including the
      # scheme (the browser fetches these directly, cross-origin).
      #
      # These are hardcoded rather than derived: Render's `fromService` does not
      # support static sites, and its host/hostport properties resolve to
      # PRIVATE-network addresses, which a browser cannot reach.
      #
      # These must be the remotes' ACTUAL .onrender.com hostnames, which include
      # a random suffix and so do NOT match the `name:` fields above. Copy them
      # from each remote service's page in the Render dashboard; update here if
      # you later attach custom domains.
      - key: VITE_EM_URL
        value: https://em-tv4i.onrender.com
      - key: VITE_DTD_URL
        value: https://mf-itm-m5xr.onrender.com
      # The shell fetches its user + permissions + nav from here before first paint.
      - key: VITE_HOST_API_URL
        value: https://mf-itm-host-api.onrender.com
    routes:
      # The shell IS a SPA — unknown paths must serve index.html so client-side
      # routing works on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
